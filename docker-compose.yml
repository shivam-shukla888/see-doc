services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: seedoc-postgres
    environment:
      POSTGRES_DB: seedoc
      POSTGRES_USER: seedoc
      POSTGRES_PASSWORD: seedoc_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: seedoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: